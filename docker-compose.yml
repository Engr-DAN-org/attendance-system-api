# remove the `target` when in production
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev # 👈 Force using the dev stage (with SDK)
    volumes:
      - ./api:/app # Mount local code to enable hot reload
      - /app/bin # Prevents unnecessary cache issues
      - /app/obj # Prevents unnecessary cache issues
    ports:
      - "5182:5182"
    env_file:
      - ./api/.env # Load environment variables from .env file
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://pgadmin:dev@db:5432/attendance-system?sslmode=disable}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      db:
        condition: service_healthy # Ensures API starts only when DB is ready
    command:
      [
        "dotnet",
        "watch",
        "run",
        "--no-launch-profile",
        "--urls",
        "http://0.0.0.0:5182",
      ]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev # 👈 Ensure dev stage is used
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents conflicts with local dependencies
    ports:
      - "5173:5173" # Vite dev server
      - "24678:24678" # HMR (Hot Module Replacement)
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - api

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: attendance-system
      POSTGRES_INITDB_ARGS: "--no-instructions"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d attendance-system"]
      interval: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: "False" # Needed to allow loading servers.json
  #   volumes:
  #     - ./pgadmin-config/servers.json:/pgadmin4/servers.json
  #     - ./pgadmin-config/pgpass:/var/lib/pgadmin/pgpass
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db
  #   restart: unless-stopped
  
  # http://localhost:8080/?pgsql=postgres-db&username=pgadmin&db=attendance-system&ns=public&select=AspNetUsers
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - db

volumes:
  postgres_data:
